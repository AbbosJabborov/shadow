services:
  db:
    image: postgres:16-alpine
    container_name: shadow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_secret_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - shadow_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadow_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_mock_data --count 200 &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-shadow-production-secret-key-replace-me}
      - ALLOWED_HOSTS=api-shadow.claive.uz,shadow.claive.uz,localhost,127.0.0.1
      - POSTGRES_DB=${POSTGRES_DB:-radar}
      - POSTGRES_USER=${POSTGRES_USER:-radar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-radar_secret_pass_2026}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - shadow_net

volumes:
  pgdata:
    driver: local

networks:
  shadow_net:
    driver: bridge
